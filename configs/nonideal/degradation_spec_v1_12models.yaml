inference_batching:
  policy: uniform_within_family          # one simple policy for all six cells of a model
  unet: batch of 8 consecutive frames, as in S7 (7-channel grid input; no site-count dependence)
  glu:
    batch_size: 1 for ALL cells including R0   # N varies per frame in G1-type cells; the wrapper forbids ragged batches
    constraint: >
      The existing wrapper forbids padding_mask and ragged batches (homogeneous N required).
      No fake padding, no new architecture, no change of the neighbour tie-break.
    paired_reference: R0 of the same model replayed with the same batching (batch 1), so every cell has a coherent R0
    diagnostic_replay_s7_batching: >
      R0 is also replayed at the S7 batching (batch 8) for the GLU models and compared with the batch-1 R0 and with S7.
      These rows are technical checks, counted separately from the nominal matrix. The historical 0.04 K per frame
      was an observed value in an earlier diagnostic, not a universal tolerance.
  retraining_truncation_to_batch_minimum: undecided_deferred_to_block3

replay_gate:
  rule: >
    R0 macro RMSE (frame -> condition -> uniform mean over conditions) within 0.05 K of the S7 reference for each
    (run, role, replica), reference present and non-empty, keys and hashes matching. The 0.05 K is the existing S7 gate.
  reference: results/month2/s7_c149_comparison/package/tables/global_by_replica.csv (best, coverage 0.05)
  reference_per_frame_optional: /home/bontempi/official_thesis_s7_c149_eval/<run_id>/per_frame/best/cov0.05/<role>/rep<k>.csv
  on_failure: >
    The task writes GATE_FAILED.json, keeps all outputs as diagnostic, writes CAMPAIGN_HALT.json and does not run
    degraded cells. Thresholds are not raised and the model is not modified. Degraded results of a run without a
    passing gate are not accepted by the aggregation.
  per_frame_and_discrepancy_maps: written for diagnosis when the optional per-frame reference is reachable

reporting_block2:
  quantities: [rmse_K, mae_K, bias_K, abs_bias_K, centered_rmse_K, jets_T_lt_1800K, hot_zone_T_ge_2100K, peak, hot_zone_iou]
  g_cells_also: >
    RMSE/MAE/bias inside vs outside the G1 region for G1 and N1G1 (region defined geometrically, not by T).
    For R0, N1, N2 and G1-eq there is no region: the regional columns are NaN with n=0 and region_defined=false.
  aggregation: frame -> condition -> uniform mean over conditions -> mean over mask replicas; seeds reported individually and as mean/min/max
  paired_differences: scenario minus R0 of the SAME model (absolute and relative), and the contrasts listed in aggregation_contrasts
  aggregation_contrasts:
    - G1 vs G1-eq (geometry vs number of observations)
    - N1G1 vs N1 and G1 (and the interaction N1G1 - N1 - G1 + R0)
    - p_on vs p_off (and the difference of their deteriorations)
    - U-Net vs GLU (deterioration, never absolute error alone)
  no_automatic_significance_tests: true
  no_success_threshold: true
  decision_rule: none      # Enrico decides after Block II whether to proceed to Block III
  seen_and_val_reported_separately: true
  replicas_are_not_independent_training_runs: true
  figure_frames_rule: >
    Fixed before any inference. Illustrative fields: all 3 VAL123 conditions and, for seen220, the first and the last
    condition in sorted sim_id order; in each, the frame with the lowest frame_index; mask replica 0; the seed-0 model
    of each of the four family x p paths. Worst cases may be added afterwards and are labelled diagnostic selection.
    Per-frame predictions for these frames are saved for all models/cells; the rest are not stored.

evaluation_counts:
  roles: {seen220: {conditions: 20, frames_per_condition: 11}, val123: {conditions: 3, frames_per_condition: 41}}
  replicas: 3
  cells: 6
  models: 12
  nominal_frame_evaluations: 74088        # 12 x 6 x 3 x 343
  per_model_nominal: 6174
  technical_replays_counted_separately:
    glu_R0_at_s7_batching_batch8: {models: 6, rows_each: 1029, total: 6174}
  unet_checks: batch-8 U-Net rows are the nominal rows themselves (same batching as S7)

documentary_notes:
  realpdebench_combustion: >
    The released fields are a LES slice (Appendix B.2: "three-dimensional, implicit, unsteady
    Large Eddy Simulation"); slice plane, interpolation to 128x128, component/axis definition,
    mesh and SGS model are not declared in the sources consulted. Combustion experiment: OH*
    chemiluminescence only; no PIV for combustion.
  direction_convention: >
    Not needed: all operators are isotropic on the two components (noise i.i.d. per component,
    discs in Euclidean mm). Sign and axis of vi/vj are not declared by the sources; the TRAIN
    statistics only suggest that vj is the stronger component along columns (inference).
