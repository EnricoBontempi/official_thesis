inference_batching:
  unet: batch of 8 consecutive frames as in S7 (per-sample convolution input, no site-count dependence)
  glu:
    constraint: >
      The existing wrapper forbids padding_mask and ragged batches (homogeneous N required).
      No fake padding, no new architecture.
    R0_N1_N2: constant N (819 sites) -> batch of 8 consecutive frames, exactly the S7 evaluation batching
    G1_N1G1_G1eq: N varies per frame -> homogeneous batches, in practice batch size 1
    paired_reference: >
      Differences of a cell are taken against the ideal replay (R0) obtained with the SAME batching
      as the cell: R0 at batch 8 for R0/N1/N2, R0 at batch 1 (extra replay of R0) for G1/N1G1/G1-eq.
      The GLU top-k tie-break is numerically sensitive to batch shape (documented in the S7
      diagnostic; 0.04 K per frame was an observed value, not a bound). A replay discrepancy is
      diagnosed, not accepted by quoting that historical figure. Model and neighbour tie-break are not modified.
  retraining_truncation_to_batch_minimum: undecided_deferred_to_block3

replay_reference:
  unet_gate_inherited_from_s7: macro RMSE within 0.05 K of the frozen S7 evaluation (existing S7 gate)
  glu_gate: none_fixed_here   # diagnose any discrepancy; report batch-shape effect explicitly

reporting_block2:
  quantities: [rmse_K, mae_K, bias_K, abs_bias_K, centered_rmse_K, jets_T_lt_1800K, hot_zone_T_ge_2100K, hot_zone_iou]
  g_cells_also: rmse inside vs outside the G1 region (region defined geometrically, not by T)
  paired_differences: vs ideal replay of the same model/frame/replica/batching
  report: magnitudes, dispersion across seeds, regions, per-condition values, worst frames
  decision_rule: none      # no automatic threshold; Enrico decides explicitly after Block II whether to proceed
  figure_frames_rule: >
    For each role and each condition, the frame with the lowest frame_index, replica 0, all models.
    Fixed here, independent of any error value.
  seen_and_val_reported_separately: true

batch_counts:
  seen220: {conditions: 20, frames_per_condition: 11}
  val123: {conditions: 3, frames_per_condition: 41}
  replicas: 3
  expected_forward_per_model: 6 cells x 3 replicas x 343 frames = 6174   # 6 models -> 37044 (R0 at batch 1 for GLU is extra)

documentary_notes:
  realpdebench_combustion: >
    The released fields are a LES slice (Appendix B.2: "three-dimensional, implicit, unsteady
    Large Eddy Simulation"); slice plane, interpolation to 128x128, component/axis definition,
    mesh and SGS model are not declared in the sources consulted. Combustion experiment: OH*
    chemiluminescence only; no PIV for combustion.
  direction_convention: >
    Not needed: all operators are isotropic on the two components (noise i.i.d. per component,
    discs in Euclidean mm). Sign and axis of vi/vj are not declared by the sources; the TRAIN
    statistics only suggest that vj is the stronger component along columns (inference).
