  base_branch: plan/nonideal-observations
  base_commit: 8d72a8151f2e20ae0650ec77c813107f860ae9c5
  c149_cache_id: month2_dense_unet_cache_opus_c149_v1
  c149_cache_aggregate_sha256: fa1c9358deb3bda0313cd74f9ab6855af87bc969c4069a463073d4c4120f03b4
  eval_mask_manifest_file_sha256: 2e2d8ff6edabf62ad56702a155140d064c0b4014d06ee96debf52811efa5c75e
  eval_mask_aggregate_payload_sha256: 7be78f35ffea2ebc598adce8cec39dc719339aac17ecadde3137f2064891ffeb
  historical_mask_seed: 20261116          # base sites: 5% random_sparse_primary, replicas 0/1/2 (unchanged)
  historical_layout_id: random_sparse_primary
  normalizer:
    stats_path: data/manifests/train_norm_stats_month2_fit.json
    stats_sha256: 678263fb4cb2598350b8fd69a71ce4843f747aa61c19556cf7f0f9c5c3ceac0e
    refit: never
    velocity_zscore_ms:
      Velocity_i: {mean: -0.059971279319043884, std: 5.673608459887564}
      Velocity_j: {mean: 4.272026277961735, std: 11.909608552613038}

seeds:
  namespace: nonideal_degradation_v1
  degradation_seed: 20261125
  forbidden_historical_seeds: [20261114, 20261116, 20261118]   # eval default, eval masks, train masks
  derivation: >
    stable_seed("nonideal_degradation_v1", degradation_seed, operator, sim_id, frame_index,
    replica_id[, attempt]) with operator in {noise, g1, g1_eq}. The string prefix and the operator
    tag make collisions with observation_mask_seed / training_mask_seed layouts structurally
    impossible; the numeric degradation_seed is also distinct from every historical seed.
  level_not_in_key: >
    The noise level is deliberately NOT part of the seed key: N1 and N2 use the same standardized
    realization scaled by sigma (N2 noise = 3 x N1 noise, perfectly correlated). Reason: paired
    level comparison without confounding by a new draw. Consequence: N1 and N2 are not independent
    samples of the noise, and one replica of N2 does not add variance information beyond N1.
  same_for_all_models_and_training_seeds: true

roles:
  evaluation: [seen_train_eval, val_eval]      # seen220 (20 x 11), VAL123 (3 x 41), reported SEPARATELY
  qualification: [train_fit]                   # generator qualification only, no model
  forbidden: [test]
  val_status: used_for_selection_and_development_not_independent

observation_model:
  order:
    - dense physical field (m/s, 128x128, from frozen cache)
    - historical sites (5%, replicas 0/1/2; identical sites and frames for all cells)
    - noise in m/s, generated for ALL original sites before invalidation
    - invalidation (removal of sites; no filling)
    - frozen normalization (z-score; implemented as value_norm + noise_ms/std, mean cancels)
    - model input
  spatial_averaging: disabled
  model_inputs:
    unet: invalid sites -> exact 0 in normalized value channels AND Mv=0 (7-channel layout unchanged)
    glu: invalid tokens removed; no padding, no fake tokens, no filling with true velocity
  never_filled_with_hidden_velocity: true
  replica_semantics: >
    A replica id jointly selects: the historical site set, the noise realization and the G1 region.
    These sources of variability change together between replicas 0/1/2 and cannot be separated
    from the replica alone. Within a replica, they are identical across cells and models.

operators:
  noise:
    id: N
    kind: iid_gaussian_per_component
    unit: m/s
    standardized_reference_sigma_ms: 1.0
    applied_to: [Velocity_i, Velocity_j]
    correlation: none            # no spatial correlation, bias or peak locking modelled
    conversion_to_normalized: {Velocity_i: "1/5.673608459887564", Velocity_j: "1/11.909608552613038"}
    sigma_ms_to_normalized_examples:
      "0.5": {Velocity_i: 0.0881, Velocity_j: 0.0420}
      "1.5": {Velocity_i: 0.2644, Velocity_j: 0.1259}
    documentary_support: >
      Literature (Sciacchitano 2015; Wieneke 2015; Sciacchitano 2019) supports the existence and
      the order of magnitude of random PIV error in pixel units (about 0.03-0.1 px typical, up to
      several tenths of px in difficult conditions). The conversion px -> m/s needs a design
      displacement and a full-scale velocity of the experiment (hypothesis, class B).
    hypothesis: >
      sigma = 0.5 and 1.5 m/s are scenario values. They are NOT verified for our combustor and
      "moderate noise" does not mean "validated experimental uncertainty".
    does_not_allow_claiming: [error of a PIV in this burner, spatial correlation, bias, peak locking]
    noise_not_estimated_from_turbulent_variance: true
  g1:
    id: G1
    family: union_of_discs
    purpose: contiguous gaps independent of T (stress test)
    dependence_on_temperature: false
    dependence_on_model_error: false
    dependence_on_velocity: false
    area_fraction: 0.25                 # requested fraction of the 128x128 cell area
    area_definition: covered cells / 16384 (grid uniform; cell area 0.581 x 0.758 mm constant)
    diameter_mm: {min: 3.0, max: 10.0, distribution: uniform}
    centre_distribution: uniform over the bounding box of cell centres (x in [-36.9, 36.9] mm, y in [62.9, 159.1] mm)
    metric: euclidean distance in physical mm (anisotropic cells handled)
    construction: >
      Draw discs sequentially (diameter, cx, cy from one RNG in that order) and OR them into the
      region until covered cells >= ceil(0.25*16384)=4096. The disc that crosses the target is kept,
      so the effective area is >= requested; it is reported per packet.
    boundaries: >
      Discs are clipped by the domain edges (no wrap, no reflection). Centres may lie anywhere in
      the bounding box, so border cells are covered less often than interior cells (measured in
      the qualification). Not corrected.
    max_discs: 500
    site_selection: >
      A historical site is removed iff its cell lies in the region. The region is defined on the
      dense grid and does not look at which sites exist.
    variation: new region for every (sim_id, frame_index, replica_id); identical across cells and models
    rejection:
      conditions: [zero_removed_sites, surviving_sites_below_min]
      min_surviving_sites: 16           # = GLU top_k; code itself needs only >= 1 (k_eff=min(16,N))
      max_attempts: 20                  # attempt index enters the seed; exhaustion raises an error
      note: rejection depends only on seeds, geometry and the site set (never on T, velocity or model)
    stress_test_status: >
      Class C synthetic stress test motivated by experimental gaps (reflections, shadows, seeding,
      field of view). It is not a mask measured on our combustor. Geometry is a single arbitrary
      choice, fixed before looking at any reconstruction metric.
  g1_eq:
    id: G1-eq
    kind: uniform_random_site_removal
    count: same number of removed sites as G1 for the same (frame, replica)
    selection: uniform without replacement among the original sites
    purpose: control that separates contiguity (geometry) from the amount of removed information

cells:
  - {id: R0,    noise_sigma_ms: null, gap: null,    role: ideal_reference}
  - {id: N1,    noise_sigma_ms: 0.5,  gap: null,    role: core_noise_scenario}
  - {id: G1,    noise_sigma_ms: null, gap: g1,      role: core_gap_stress_test}
  - {id: N1G1,  noise_sigma_ms: 0.5,  gap: g1,      role: core_combination_same_realizations}
  - {id: G1-eq, noise_sigma_ms: null, gap: g1_eq,   role: control_equal_site_count}
  - {id: N2,    noise_sigma_ms: 1.5,  gap: null,    role: severe_noise_stress}
cell_relations:
  N1_vs_N1G1: same noise at the surviving sites (noise drawn before invalidation, keyed by flat site index)
  N1_vs_N2: same standardized realization, N2 = 3 x N1
  G1_vs_N1G1_vs_G1eq: G1 and N1G1 share the same region; G1-eq removes the same count

excluded_axes_not_in_this_block:
  - spatial averaging / interrogation window
  - regular resampling at PIV pitch
  - T-dependent gaps (leakage risk)
  - spurious vectors as large value errors (invalidation only)
  - observed temperatures / outlet thermocouples
  - EngineBench mask (not downloaded)

