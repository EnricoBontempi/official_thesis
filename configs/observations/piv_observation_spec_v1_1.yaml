rejection_sensitivity:
  fraction: 0.1
  levels:
    flag: rejected vectors absent (U-Net Mv=0; GLU token removed)
    sub: rejected vectors replaced by the iterative 3x3 mean and presented as measured (Mv=1)
  applied_to: PIV-A only
  same_positions_in_both_levels: true
  substitution_rules:
    mean3x3_iterative: principal rule of the `sub` level (TUM micro-PIV, GTMC practice)
    mean5x5_iterative: 'variant: iterative mean of known neighbours in a 5x5 area; area declared in the Cardiff processing XML; the comparison
      with real substituted values depends on an unofficial decoder and is NOT a validation'
    passes: the passes are repeated until every rejected vector is filled; meta.sub_passes and meta.sub_passes_gt3 are recorded
operation_order:
- LES velocity in m/s (frozen statistics)
- response convolution limited to the field, renormalised at the edge
- valid-vector selection (window rule)
- correlated error
- rejections (SENS-REJ only)
- substitution (level sub only)
- frozen normalisation
- U-Net / GLU packet
no_temperature: no generator argument, helper or test fixture reads T; temperature diagnostics are separate scripts
seeds:
  namespace: piv_observation_v1
  role_seeds:
    train: 20261210
    selection: 20261211
    eval: 20261212
  key: stable_seed(namespace, role_seed, operator, component, sim_id, frame_index, replica_or_epoch) via zlib.crc32; model family and model seed
    are NOT part of the key
  training: one new error realisation per (frame, epoch)
  evaluation: 3 replicas
  excluded_historical:
  - 20261114
  - 20261116
  - 20261118
  - 20261125
  - 20261201
  - 20261202
parameter_classification:
- id: grid_steps_mm
  value: rows 0.581057, cols 0.758123
  class: documentato
  source: 'dataset geometry (INV B-data-audit-001); assignment rows<->x, cols<->y: ipotesi R1 ''probabile'''
- id: assignment_rows_x_cols_y
  value: rows<->x (lateral), cols<->y (axial)
  class: scelta di modellazione (R1)
  source: decisione_R1 sec. 3; SENS-SWAP covers the historical convention
- id: components
  value: (vi, vj) planar; vi transverse, vj axial; vk out of plane, not used
  class: ipotesi dichiarata (probabile)
  source: orientation_note.md, decisione_R1 sec. 2
- id: W_A_mm
  value: 1.3
  class: documentato
  source: STO12 sec. 2.3.2 (GTMC 5 Hz, 1.3 mm, 50 % overlap)
- id: W_B_mm
  value: 1.5
  class: documentato
  source: STO12 sec. 2.3.3 (GTMC 5 kHz, 1.5 x 1.5 mm^2; BOX10 p.15 quotes 1.0 mm)
- id: layout_one_vector_per_LES_node
  value: step = LES cell, anisotropic
  class: trasferimento
  source: PIV step = W/2 (BOX10, SAI16, KAR20); LES cell 0.581/0.758 mm used instead of 0.5W (declared)
- id: field_A
  value: whole slice (extreme nodes)
  class: trasferimento
  source: STO12 'entire vertical section'; assumption slice = observed section
- id: field_B_size
  value: 30 x 30 mm (52 rows x 40 cols)
  class: documentato
  source: STO12 sec. 2.3.3
- id: field_B_positions
  value: B-in (train+eval), B-down, B-off (eval)
  class: scelta di modellazione (R1)
  source: STO12 'above the nozzle'; decisione_R1 sec. 7; nozzle position relative to the slice unknown
- id: window_rule
  value: vector exists iff [-W/2, W/2]^2 inside the field
  class: trasferimento
  source: PIV practice; margin 2 rows / 1 col for W=1.3 and 1.5
- id: response_kernel
  value: MHG b=0.35, discrete L_sr = 0.93 W, calibrated per axis (1 %)
  class: trasferimento
  source: WIE17 Tab. 2.1/2.4 (synthetic DaVis multi-pass); GTMC weighting not declared
- id: kernel_support
  value: 4 sigma, truncated and renormalised; truncated at the field edge
  class: scelta di modellazione (R1)
  source: decisione_R1 sec. 4; edge behaviour is a declared approximation
- id: field_discretisation
  value: piecewise constant per LES cell, cell-integrated weights
  class: scelta di modellazione (R1)
  source: roadmap sec. 2.3(3)
- id: error_amplitude
  value: sigma_u,c = sigma_px * v_ref,c / d_max, sigma_px = 0.10 px, d_max = 6 px
  class: trasferimento
  source: STO12 sec. 2.3.2 (+-0.1 px, Delta t per condition); WIE17 s4.4.2 (0.060 px measured) and Tab. 2.4 (0.146 px synthetic). '+-0.1 px' is
    NOT read as sigma
- id: d_max_px
  value: 6
  class: trasferimento
  source: inference from STO12 (16 px = 1.3 mm, v ~ 80 m/s, 6 us)
- id: v_ref
  value: p99.9 of |u_planar|, all nodes, frames 0:2001:10 of each condition
  class: trasferimento
  source: 'STO12: Delta t chosen per condition on the instantaneous velocity scale; decisione_R1 sec. 6'
- id: error_distribution
  value: Gaussian
  class: ipotesi di modello
  source: not established for flames
- id: error_correlation
  value: separate noise kernel g, MHG b=0.35, L_sr = 1.2 W, discrete, calibrated
  class: trasferimento
  source: 'WIE17 Tab. 2.4 / s4.3 (rho(2d)=0.11 at 50 % overlap vs 0 in the review: unresolved). D-rho closed at R2: Neal (different processing,
    residual includes the reference) does not confirm the model at the first lag; principal unchanged; SENS-RHO0 mandatory next to the principal
    on A and B-in'
- id: components_independent
  value: u and v errors independent
  class: ipotesi
  source: WIE17 s4.3
- id: error_stationarity
  value: white noise on a grid padded by 16 nodes
  class: scelta di modellazione (R1)
  source: numerical choice
- id: bias
  value: none
  class: scelta di modellazione (R1)
  source: no transferable bias documented (SINT 2.2)
- id: rejections_main
  value: none in main/controls
  class: approssimazione dichiarata
  source: released GTMC data are complete after interpolation (BOX10 p.31); this does not prove the absence of rejections
- id: rejection_fraction
  value: 0.1
  class: sensibilita
  source: 'upper bound quoted by BAU15 p.49 (micro-PIV H2): NOT calibrated, NOT transferred'
- id: rejection_clu
  value: top-fraction nodes of a correlated Gaussian field on the noise-kernel scale
  class: sensibilita
  source: morphology not documented in swirl flames
- id: substitution
  value: iterative 3x3 mean of known neighbours, presented as measured (Mv=1)
  class: trasferimento
  source: BAU15 p.49, BOX10 p.31 practice; Cardiff F2.5 qualifies the rule, not the frequency
- id: top_hat
  value: width tuned so that discrete L_sr = W
  class: sensibilita
  source: decisione_R1 sec. 5
- id: seeds
  value: new namespace piv_observation_v1; roles train/selection/eval
  class: scelta di modellazione (R1)
  source: distinct from 20261114/16/18 and 20261125/20261201/20261202
- id: tail_sensitivity
  value: 'SENS-TAIL: Student t, nu = 7 (excess kurtosis 2), same realisation'
  class: sensibilita
  source: Neal residual kurtosis 1.6-2.8; not calibrated
- id: substitution_5x5
  value: mean5x5_iterative
  class: sensibilita
  source: area declared in the Cardiff XML (PIVD:S2D-01); comparison with real values is not a validation (unofficial decoder)
- id: rho0_mandatory
  value: SENS-RHO0 reported next to the principal in every phase-3 comparison on A and B-in
  class: decisione R2
  source: decisione_R2 sec. 3
