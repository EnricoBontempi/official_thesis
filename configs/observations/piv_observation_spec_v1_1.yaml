kernel_definitions:
  mhg: F(s) = (1 - b s^2/sig^2) exp(-s^2/2sig^2)/((1-b) sig sqrt(2 pi)), b=0.35; discrete weights = integral of F over the LES cell, clipped to
    +-4 sig, renormalised
  tophat: weights = overlap of [-W_eff/2, W_eff/2] with the cell, / W_eff
  lsr_discrete: step / sum(w^2)
  calibration: param tuned per axis so that the DISCRETE L_sr equals the target (response 0.93 W, noise 1.2 W, top-hat W); tolerance 1 %; failure
    raises instead of forcing
windows_B:
  rule: '30 x 30 mm; B-in: rows centred on the axis (63.5), columns adjacent to the inlet (last column); B-down: same rows, adjacent window towards
    lower columns; B-off: columns as B-in, rows starting at row 64'
  primary_steps:
    B-in:
    - 38
    - 89
    - 88
    - 127
    B-down:
    - 38
    - 89
    - 48
    - 87
    B-off:
    - 64
    - 115
    - 88
    - 127
  swap_steps:
    B-in:
    - 44
    - 83
    - 76
    - 127
    B-down:
    - 44
    - 83
    - 24
    - 75
    B-off:
    - 64
    - 103
    - 76
    - 127
  format: '[row0, row1, col0, col1] inclusive'
  train_position: B-in
configs:
  PIV-A:
    field: A
    W_mm: 1.3
    response: mhg
    noise: corr
    sigma_px: 0.1
    steps: primary
    role: main
    note: training+evaluation
  IDEAL-A:
    field: A
    W_mm: 1.3
    response: ideal
