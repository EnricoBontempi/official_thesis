# U6 Engaging scientific run contract (dense U-Net p_off ablation, Step 2.4).
# Decision: Enrico 2026-11-17 — first part of U6: one p_off seed-0 training +
# snapshot-swap on its best checkpoint. Same schedule as U4; fresh init.
# Supervisor ratification not claimed. Requires CLI --authorize-scientific-u6.

experiment_id: month2_dense_unet_u6_poff_engaging_v1
paired_experiment: month2_dense_unet_v1
status: authorized_poff_seed0_pending_execution
scientific_training_authorized: true
budget_definitively_approved: true
u6_executed: false

decision:
  by: Enrico
  date: "2026-11-17"
  summary: >
    First U6 slice: train dense U-Net p_off seed 0 with the same architecture,
    data, global fit-only stats, budget and selection rules as U4 p_on; then
    repeat the U5 snapshot-swap control on the new best checkpoint using the
    saved U5 pairings. Other seeds deferred to discussion. No supervisor
    ratification claimed.
  supervisor_ratification: not_claimed
  paired_u4_run_id: u4_pon_seed0_engaging_v1
  opus_u4_u5_review: >
    External Opus review (reported by Enrico): usable with reserves; no
    invalidating defect found. Confirmed aligned replay identity, swap pairing/
    transform, VAL non-independence, best 26.931 K @160 and last 28.055 K @730.
    Baseline refit in U5 noted as mandate deviation but per-frame metrics
    matched U3 within ~5.5e-12. No indication to extend U4. Not a supervisor
    ratification.

inherits_scientific_contract:
  path: configs/experiments/month2_dense_unet.yaml
  note: Must satisfy assert_dense_scientific_contract on the parent dense YAML.

model:
  path: configs/models/unet_small.yaml
  base_channels: 32

training_candidate:
  temporal_mode: single_frame
  task_mode: temperature_free
  K: 0
  site_fraction: 1.0
  p_conditioning: false   # p_off: NH3/phi channels exactly zero
  seed: 0
  device: cuda
  precision: fp32
  allow_tf32: false
  batch_size: 8
  n_epochs: 1000
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_updates: 950
  schedule_kind: warmup_then_reduce_on_plateau
  plateau:
    mode: min
    factor: 0.5
    patience_evals: 5
    threshold_rel: 0.001
    min_lr: 1.0e-5
    metric: val_mean_condition_rmse_K
  grad_clip_norm: 1.0
  eval_every_epochs: 10
  eval_roles: [train_fit, seen_train_eval, val_eval]
  wall_time_cap_hours: 6.0
  wall_time_cap_configurable: true
  allow_automatic_lr_fallback_3e4: false
  num_workers: 0
  init: fresh_seed0_no_overfit_or_profile_or_pon_weights
  selection:
    role: val_eval
    metric: mean_over_conditions_of_full_field_RMSE_K
    tie_break: first_minimum
    also_keep: last
  also_evaluate: [seen_train_eval, train_fit]
  early_stopping:
    enabled: true
    min_epochs: 200
    patience_evals: 15
    rel_improvement: 0.001
    reset_patience_on_lr_reduce: true
    metric: val_mean_condition_rmse_K
    note: operational_convention_not_physical_certification
  checkpoint:
    boundary: epoch_complete_only
    kinds: [dense_unet_epoch_complete_v2, dense_unet_epoch_partial_v2]
    partial_overwrite_last: false
    save_optimizer_scheduler_rng_history: true
  resume_policy:
    boundary: epoch_complete_only
    reject_incompatible_data_arch_science: true
    allow_n_epochs_extension: explicit_flag_only

artifacts:
  results_root: results/month2_dense_unet
  run_id_pattern: u6_poff_seed0_engaging_<label>
  checkpoints_gitignored: true
  refuse_overwrite_existing_run_dir: true

command_template: >
  python scripts/07_train_reconstructor.py train-u6
  --authorize-scientific-u6
  --config configs/experiments/month2_dense_unet_u6_candidate.yaml
  --dense-config configs/experiments/month2_dense_unet.yaml
  --run-id u6_poff_seed0_engaging_v1
  --cache-root data/processed/month2_dense_unet_cache
  --device cuda
  --wall-hours 6
