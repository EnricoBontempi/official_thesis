# U4 Engaging scientific run contract (dense U-Net, Step 2.4).
# Decision: Enrico, 2026-11-17 — first training on Engaging, max 1000 epochs,
# VAL selection + early stop on plateau. Does NOT invent supervisor ratification.
# Requires CLI --authorize-scientific-u4 to execute.

experiment_id: month2_dense_unet_u4_engaging_v1
paired_experiment: month2_dense_unet_v1
status: executed_engaging_single_run_pon_seed0_early_stop
scientific_training_authorized: true
budget_definitively_approved: true
u4_executed: true

decision:
  by: Enrico
  date: "2026-11-17"
  summary: >
    First U-Net training on Engaging; initial max 1000 epochs; checkpoint on
    VAL/DEV; early stop on plateau. Replaces CPU/200 candidate. Does not adopt
    Opus WSD branching. Continuation past 1000 only by later explicit decision.
  supervisor_ratification: not_claimed
  execution_record:
    run_id: u4_pon_seed0_engaging_v1
    slurm_job_id: "29465586"
    git_commit: 50bda7fe42323d2abd8ef46763be65ccbaf3f008
    status: stopped_early_plateau
    best_val_rmse_K: 26.931456559998264
    best_val_epoch: 160
    epochs_completed: 730

inherits_scientific_contract:
  path: configs/experiments/month2_dense_unet.yaml
  note: Must satisfy assert_dense_scientific_contract on the parent dense YAML.

model:
  path: configs/models/unet_small.yaml
  base_channels: 32

training_candidate:
  temporal_mode: single_frame
  task_mode: temperature_free
  K: 0
  site_fraction: 1.0
  p_conditioning: true   # p_on only; no other seed/model authorized
  seed: 0
  device: cuda
  precision: fp32
  allow_tf32: false
  batch_size: 8
  n_epochs: 1000
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_updates: 950
  schedule_kind: warmup_then_reduce_on_plateau
  plateau:
    mode: min
    factor: 0.5
    patience_evals: 5
    threshold_rel: 0.001
    min_lr: 1.0e-5
    metric: val_mean_condition_rmse_K
  grad_clip_norm: 1.0
  eval_every_epochs: 10
  eval_roles: [train_fit, seen_train_eval, val_eval]
  wall_time_cap_hours: 6.0
  wall_time_cap_configurable: true
  allow_automatic_lr_fallback_3e4: false
  num_workers: 0
  init: fresh_seed0_no_overfit_or_profile_weights
  selection:
    role: val_eval
    metric: mean_over_conditions_of_full_field_RMSE_K
    tie_break: first_minimum
    also_keep: last
  also_evaluate: [seen_train_eval, train_fit]
  early_stopping:
    enabled: true
    min_epochs: 200
    patience_evals: 15
    rel_improvement: 0.001
    reset_patience_on_lr_reduce: true
    metric: val_mean_condition_rmse_K
    note: operational_convention_not_physical_certification
  checkpoint:
    boundary: epoch_complete_only
    kinds: [dense_unet_epoch_complete_v2, dense_unet_epoch_partial_v2]
    partial_overwrite_last: false
    save_optimizer_scheduler_rng_history: true
  resume_policy:
    boundary: epoch_complete_only
    reject_incompatible_data_arch_science: true
    allow_n_epochs_extension: explicit_flag_only

artifacts:
  results_root: results/month2_dense_unet
  run_id_pattern: u4_pon_seed0_engaging_<label>
  checkpoints_gitignored: true
  refuse_overwrite_existing_run_dir: true

command_template: >
  python scripts/07_train_reconstructor.py train-u4
  --authorize-scientific-u4
  --config configs/experiments/month2_dense_unet_u4_candidate.yaml
  --dense-config configs/experiments/month2_dense_unet.yaml
  --run-id u4_pon_seed0_engaging_v1
  --cache-root data/processed/month2_dense_unet_cache
  --device cuda
  --wall-hours 6
