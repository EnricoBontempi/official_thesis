# Executable sparse protocol contract (S1–S2). Unknown scientific keys are refused.
protocol_id: month2_sparse_v1
roadmap: roadmapsparse.md
status: s4_in_progress_profiling_jobs_failed_einops_s5_prepared_not_submitted
scientific_training_authorized: false
s4_profiling_diagnostic_only: true
s5_screening_authorized: false
s5_candidates_prepared: true
s5_auto_launch: false

roles:
  train_fit: 760
  seen_train_eval: 220
  val_eval: 123
  test_payloads: none

observation:
  components: 2C
  co_located: true
  K: 0
  task_mode: temperature_free
  coverages_nominal: [0.01, 0.05, 0.20]
  n_sites: {0.01: 164, 0.05: 819, 0.20: 3277}
  layout_id: random_sparse_primary
  eval_mask_seed: 20261116
  eval_replicas: [0, 1, 2]
  nested_policy: nested_subset_extension_v1
  mask_payload_manifest: data/manifests/month2_sparse_eval_masks_manifest.json
  mask_payload_root: data/processed/month2_sparse_eval_masks
  format_id: month2_sparse_eval_masks_v1

training_masks:
  first_contract_coverage: 0.05
  train_mask_seed: 20261118
  resample_per_frame_epoch: true
  namespace: training_mask_seed  # distinct from eval observation_mask_seed
  set_epoch_required: true

seeds:
  model_seed: 0
  shuffle_seed: 0
  train_mask_seed: 20261118
  eval_mask_seed: 20261116

normalization:
  stats: data/manifests/train_norm_stats_month2_fit.json
  fit_only: true
  distinguish_physical_vs_normalized: true
  baseline_adapters_require: physical_m_s

cache:
  reuse: data/processed/month2_dense_unet_cache
  verify_fingerprints_on_load: true
  rebuild_raw_if_invalid: false

unet_sparse:
  config: configs/models/unet_sparse.yaml
  channels: 7
  channel_order:
    - vi_obs_norm
    - vj_obs_norm
    - Mv
    - x_scaled
    - y_scaled
    - nh3_norm
    - phi_norm
  base_channels: 32
  p_off_zeros_last_two_channels: true
  warm_start_dense: false

glu:
  implementation_phase: S3_done_s4_profiling
  audit: docs/month2/04_glu_release_adaptation.md
  config: configs/models/glu_minimal.yaml
  wrapper: src/combustion_recon/models/glu_reconstructor.py
  wrapper_authorized_this_mission: true
  scientific_training_authorized: false

scientific_runner:
  module: src/combustion_recon/training/sparse_scientific_loop.py
  candidate: configs/experiments/month2_sparse_scientific_candidate.yaml
  schedule: warmup_950_then_reduce_on_plateau_val5pct_3replicas
  selection: first_absolute_minimum_val_mean_condition_rmse_K
  early_stop: min_200_epochs_15_evals_rel_0.001_reset_on_lr_reduce
  tranche_epochs: 1000
  profiling: configs/experiments/month2_sparse_s4_profiling.yaml

gappypod_nested:
  config: configs/experiments/month2_sparse_gappypod_nested.yaml
  frozen_lambdas_from_5pct: true
  status: blocked_missing_fitted_pod_artifacts

s5_screening_prepared:
  index: configs/experiments/month2_sparse_s5_screening.yaml
  candidates:
    - configs/experiments/s5_sparse_unet_pon_seed0.yaml
    - configs/experiments/s5_sparse_unet_poff_seed0.yaml
    - configs/experiments/s5_adapted_glu_pon_seed0.yaml
    - configs/experiments/s5_adapted_glu_poff_seed0.yaml
  launchers_not_submitted:
    - scripts/engaging/s5_unet_pon.sbatch
    - scripts/engaging/s5_unet_poff.sbatch
    - scripts/engaging/s5_glu_pon.sbatch
    - scripts/engaging/s5_glu_poff.sbatch
  train_entrypoint: scripts/16_train_sparse_scientific.py
  note: scientific_training_authorized remains false; no afterok; no auto-launch

forbidden_this_mission:
  - scientific_training_760
  - val_tuning
  - s5_screening
  - scientific_snapshot_control
  - test_payloads
  - new_raw_downloads
  - modify_HONF
  - modify_external_GLU_Reconstruction
  - reopen_dense_U0_U7
  - silent_pod_refit
  - silent_lambda_retune
  - preemptable_fallback_for_s4

diagnostic_overfit:
  n_frames: 8
  role: train_fit
  weights_reusable_for_science: false
