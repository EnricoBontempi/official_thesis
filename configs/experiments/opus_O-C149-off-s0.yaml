# Opus wave-2 C149 — densified TRAIN pool (2980 frames).
# Fresh init; historical 760-frame normalizer; scientific epoch 760/95.

experiment_id: month2_opus_O-C149-off-s0_v1
status: opus_wave2_c149_authorized
scientific_training_authorized: true
profiling_diagnostic_only: false
opus_submission_authorized: true
family: sparse_unet

decision:
  by: Enrico
  date: "2026-11-19"
  summary: >
    Enrico authorized Opus C149 on/off seed-0 after wave-1 submission,
    contingent on verified densified cache and runner controls.

inherits_protocol:
  path: configs/experiments/month2_sparse_protocol.yaml

model:
  path: configs/models/unet_sparse.yaml
  base_channels: 32
  sparse_unet: configs/models/unet_sparse.yaml
  adapted_glu: configs/models/glu_minimal.yaml

training_candidate:
  family: sparse_unet
  p_conditioning: false
  pool_id: C149
  presentations_per_scientific_epoch: 760
  require_eval_mask_payload: true
  amp: false
  torch_compile: false
  save_best_seen_diagnostic: true

  temporal_mode: single_frame
  task_mode: temperature_free
  K: 0
  site_fraction: 0.05
  seed: 0
  shuffle_seed: 0
  train_mask_seed: 20261118
  eval_mask_seed: 20261116
  layout_id: random_sparse_primary
  val_replicas: [0, 1, 2]
  device: cuda
  precision: fp32
  allow_tf32: false
  batch_size: 8
  n_epochs: 1000
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_updates: 950
  schedule_kind: warmup_then_reduce_on_plateau
  plateau:
    mode: min
    factor: 0.5
    patience_evals: 5
    threshold_rel: 0.001
    min_lr: 1.0e-5
    metric: val_mean_condition_rmse_K
  grad_clip_norm: 1.0
  eval_every_epochs: 10
  eval_roles: [train_fit, seen_train_eval, val_eval]
  wall_time_cap_hours: 5.5
  wall_time_cap_configurable: true
  allow_automatic_lr_fallback_3e4: false
  num_workers: 0
  init: fresh_seed0_no_s5_or_wave1_weights
  decode_chunk_size: 512
  decode_chunked_eval: true
  microbatch_size: null
  selection:
    role: val_eval
    coverage: 0.05
    replicas: [0, 1, 2]
    metric: mean_over_replicas_of_mean_condition_full_field_RMSE_K
    tie_break: first_absolute_minimum
    also_keep: [last, best_seen_diagnostic]
    significant_ref_distinct_from_absolute_best: true
  also_evaluate: [seen_train_eval, train_fit]
  early_stopping:
    enabled: true
    min_epochs: 200
    patience_evals: 15
    rel_improvement: 0.001
    reset_patience_on_lr_reduce: true
    metric: val_mean_condition_rmse_K
    note: operational_convention_not_physical_certification
  checkpoint:
    boundary: epoch_complete_only
    kinds: [sparse_scientific_epoch_complete_v1, sparse_scientific_epoch_partial_v1]
    partial_overwrite_last: false
    save_optimizer_scheduler_rng_history: true
    save_mask_epoch_set_epoch: true
    save_glu_geometry_buffers: true
  resume_policy:
    boundary: epoch_complete_only
    reject_incompatible_data_arch_science: true
    allow_n_epochs_extension: explicit_flag_only

operational_from_s5_recipe:
  sbatch_time: "06:00:00"
  sbatch_mem: 64G
  sbatch_gres: gpu:l40s:1
  sbatch_account: mit_amf_advanced_gpu
  sbatch_partition: mit_normal_gpu
  sbatch_qos: mit_amf_advanced_gpu
  microbatch_size: null
  note: >
    C149 attempt2 reuses the verified densified cache. Output is a new
    directory. The failed attempt and wave-1 runs stay untouched.
  pool_frames_per_condition: 149
  pool_total_frames: 2980
  freeze_record: roadmapopus.md

artifacts:
  results_root_engaging: /home/bontempi/official_thesis_opus_c149_attempt2_runs
  run_id: O-C149-off-s0
  scientific_run_id: O-C149-off-s0
  attempt: 2
  previous_failed_job: 29613546
  previous_out_preserved: /home/bontempi/official_thesis_opus_c149_runs/O-C149-off-s0
  previous_slurm_log_preserved: /home/bontempi/projects/official_thesis_opus_c149/slurm-29613546.out
  previous_checkout_preserved: /home/bontempi/projects/official_thesis_opus_c149
  warm_start: false
  refuse_overwrite_existing_run_dir: true
  refuse_load_s5_or_wave1_checkpoints: true

notes:
  - Opus C149 attempt2 of the same scientific run. No GLU/Astra/S7/TEST.
  - Attempt 1 died before epoch 0 because SparseUNetCacheDataset validated only the historical cache id.
  - train_eval metric uses reference760 (A38 subset) even though pool is 2980.
