# Sparse scientific training contract (S4 runner complete; S5 screening NOT authorized).
# Consumed by combustion_recon.training.sparse_scientific_loop.
# Requires explicit CLI authorization for any future scientific run (S5).

experiment_id: month2_sparse_scientific_v1
status: s4_runner_ready_screening_not_authorized
scientific_training_authorized: false
profiling_diagnostic_only: false
family: sparse_unet  # also adapted_glu via training_candidate.family override per run

decision:
  by: Enrico
  date: "2026-11-18"
  summary: >
    S4 completes the scientific epoch runner (warmup/plateau/early-stop/resume)
    and submits diagnostic profiling + nested GappyPOD eval prep. No S5 screening
    from this file. Initial tranche 1000 epochs; extension explicit only.
  supervisor_ratification: not_claimed

inherits_protocol:
  path: configs/experiments/month2_sparse_protocol.yaml

model:
  sparse_unet: configs/models/unet_sparse.yaml
  adapted_glu: configs/models/glu_minimal.yaml
  base_channels: 32

training_candidate:
  temporal_mode: single_frame
  task_mode: temperature_free
  K: 0
  site_fraction: 0.05
  family: sparse_unet
  p_conditioning: true
  seed: 0
  shuffle_seed: 0
  train_mask_seed: 20261118
  eval_mask_seed: 20261116
  layout_id: random_sparse_primary
  val_replicas: [0, 1, 2]
  device: cuda
  precision: fp32
  allow_tf32: false
  batch_size: 8
  n_epochs: 1000
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_updates: 950
  schedule_kind: warmup_then_reduce_on_plateau
  plateau:
    mode: min
    factor: 0.5
    patience_evals: 5
    threshold_rel: 0.001
    min_lr: 1.0e-5
    metric: val_mean_condition_rmse_K
  grad_clip_norm: 1.0
  eval_every_epochs: 10
  eval_roles: [train_fit, seen_train_eval, val_eval]
  wall_time_cap_hours: 6.0
  wall_time_cap_configurable: true
  allow_automatic_lr_fallback_3e4: false
  num_workers: 0
  init: fresh_seed0_no_overfit_or_profile_weights
  decode_chunk_size: 512
  decode_chunked_eval: true
  microbatch_size: null
  selection:
    role: val_eval
    coverage: 0.05
    replicas: [0, 1, 2]
    metric: mean_over_replicas_of_mean_condition_full_field_RMSE_K
    tie_break: first_absolute_minimum
    also_keep: last
    significant_ref_distinct_from_absolute_best: true
  also_evaluate: [seen_train_eval, train_fit]
  early_stopping:
    enabled: true
    min_epochs: 200
    patience_evals: 15
    rel_improvement: 0.001
    reset_patience_on_lr_reduce: true
    metric: val_mean_condition_rmse_K
    note: operational_convention_not_physical_certification
  checkpoint:
    boundary: epoch_complete_only
    kinds: [sparse_scientific_epoch_complete_v1, sparse_scientific_epoch_partial_v1]
    partial_overwrite_last: false
    save_optimizer_scheduler_rng_history: true
    save_mask_epoch_set_epoch: true
    save_glu_geometry_buffers: true
  resume_policy:
    boundary: epoch_complete_only
    reject_incompatible_data_arch_science: true
    allow_n_epochs_extension: explicit_flag_only

artifacts:
  results_root: results/month2/sparse_scientific
  run_id_pattern: s5_<family>_p<on|off>_seed0_engaging_<label>
  checkpoints_gitignored: true
  refuse_overwrite_existing_run_dir: true
  note: S5 run dirs not created by S4 profiling

notes:
  - TRAIN/seen metrics are diagnostic only; never used for selection or early stop.
  - No selection on 1%/20%, swap, or TEST.
  - Profiling weights must not be reused for scientific training.
