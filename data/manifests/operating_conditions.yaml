dataset: RealPDEBench / combustion / numerical
source_repo: AI4Science-WestlakeU/RealPDEBench
n_operating_conditions: 30
channel_names:
- Absolute_Pressure
- Chemistry_Heat_Release_Rate
- Mole_Fraction_of_CH4
- Mole_Fraction_of_CO
- Mole_Fraction_of_CO2
- Mole_Fraction_of_H2O
- Mole_Fraction_of_NH2
- Mole_Fraction_of_NH3
- Mole_Fraction_of_OH
- Pressure
- Temperature
- Velocity[i]
- Velocity[j]
- Velocity[k]
- Velocity_Magnitude
channels_doc_note: The `observed` column stores the measurable modality (OH* chemiluminescence
  intensity for real, surrogate-mapped intensity for numerical). The `numerical` column
  packs 15 simulation fields along the last axis in the order given by `numerical_axis_names`.
geometry:
  grid:
  - 128
  - 128
  axis0: y (m), increases with row index; physical range ~[0.063, 0.159] m
  axis1: x (m), increases with column index; physical range ~[-0.037, +0.037] m
  symmetry_axis: "horizontal midline row\u224864 (y\u22480.111 m) \u2014 annular V-flame\
    \ symmetry"
  burner_inlet: "Cold unburnt reactant jets enter from the RIGHT boundary (col\u2248\
    127, x\u2248+0.037 m) and diverge in a V toward the LEFT (col\u22480, x\u2248\
    -0.037 m)"
  Velocity[i]_ch11: "In-plane radial/transverse (expands \xB1 away from row-64 centerline)"
  Velocity[j]_ch12: "Axial along main jet (strongly + in V-branches, \u2212 in central\
    \ IRZ)"
  Velocity[k]_ch13: Out-of-plane azimuthal swirl (opposite signs above/below row 64)
  Velocity_magnitude_note: Prefer recomputed |u|=sqrt(vi^2+vj^2+vk^2); exported ch14
    is correlated but not identical and can be negative
lexicographic_shard_map_verified_all_30: true
